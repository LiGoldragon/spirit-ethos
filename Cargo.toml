[package]
name = "spirit-ethos"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/spirit-ethos"
description = "Sealed authored Ethos roots for the Spirit contracts"
publish = false

[lib]
name = "spirit_ethos"
path = "src/lib.rs"

[dev-dependencies]
nomos-engine = { git = "https://github.com/LiGoldragon/nomos-engine.git", rev = "64a67c5b2465560e1b6db214d0c66d2258116856" }
rkyv = { version = "=0.8.17", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
serde_json = "1"
sha2 = "0.10"
signal-domain = { git = "https://github.com/LiGoldragon/signal-domain.git", rev = "fbc400bf5ed5e4c4d27ef4e76cb48fa4e5d53658", default-features = false }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
